services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader_local_pw
      POSTGRES_DB: trading
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgres://trader:trader_local_pw@db:5432/trading
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      - api

volumes:
  pgdata:
  api_node_modules:
  web_node_modules:
